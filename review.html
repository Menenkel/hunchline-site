<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Hunchline review</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg: #000; --fg: #fff; --fg2: #e6e6e6; --muted: #7a7a7a;
    --line: #2a2a2a; --line2: #3a3a3a; --accent: #f2c31b; --bad: #ff6b5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .summary { font-size: 13px; color: var(--muted); margin: 0; }
  .card { border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: opacity .2s, border-color .2s; }
  .card.done { opacity: .55; }
  .card.live { border-color: var(--accent); opacity: 1; }
  .q { font-size: 17px; font-weight: 700; margin: 0; line-height: 1.3; }
  .row { font-size: 13px; color: var(--fg2); margin: 0; }
  .row strong { color: var(--fg); }
  .row a { color: var(--fg); word-break: break-word; }
  .warn { font-size: 13px; color: var(--accent); margin: 0; }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 4px; }
  button {
    font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 12px 8px; border-radius: 12px; cursor: pointer; border: 1.5px solid var(--line2);
    background: transparent; color: var(--fg); min-height: 44px;
  }
  button.approve { background: var(--fg); color: #000; border-color: var(--fg); }
  button:disabled { opacity: .4; cursor: default; }
  .status { font-size: 13px; font-weight: 700; margin: 0; }
  .status.ok { color: var(--accent); }
  .status.bad { color: var(--bad); }
  .undo { font-size: 12px; color: var(--muted); }
  #list { display: flex; flex-direction: column; gap: 14px; }
  .empty, .error { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 12px; }
  .error { color: var(--bad); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="label">Hunchline curator</p>
      <h1 id="title">Today's questions</h1>
    </div>
    <p class="summary" id="summary"></p>
  </header>
  <p class="summary">Approve plays it today if its category is free, otherwise it goes to the archive. Archive keeps it for Plus without playing it today. Undecided questions are deleted after 7 days.</p>
  <div id="list" aria-live="polite"></div>
  <p class="empty" id="loading">Loading…</p>
  <p class="error" id="error" hidden></p>
</main>

<script>
  const API = "https://qoecsasamqwbhfnbsddp.supabase.co/functions/v1/curator-review";
  const params = new URLSearchParams(location.search);
  const auth = { day: params.get("day"), exp: params.get("exp"), sig: params.get("sig") };

  const STATE_TEXT = {
    live: "✓ Live today",
    archived: "✓ In the archive",
    played: "✓ Already played",
    rejected: "✗ Rejected",
  };

  const $ = (id) => document.getElementById(id);
  let candidates = [];

  function el(tag, attrs = {}, text) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function showError(message) {
    $("loading").hidden = true;
    $("error").hidden = false;
    $("error").textContent = message;
  }

  function updateSummary() {
    const open = candidates.filter((c) => c.state === "pending").length;
    $("summary").textContent = candidates.length
      ? (open ? `${open} of ${candidates.length} to decide` : `All ${candidates.length} decided`)
      : "";
  }

  function render(c) {
    const card = el("article", { class: "card", id: "q-" + c.id });
    card.append(el("p", { class: "label" }, c.category));
    card.append(el("p", { class: "q" }, c.question));
    if (c.needs_manual_check) {
      card.append(el("p", { class: "warn" },
        `⚠️ Check the source yourself: ${c.source_name} blocks automated reading, so this number wasn't verified.`));
    }
    const answer = el("p", { class: "row" }, "Answer: ");
    answer.append(el("strong", {}, `${Number(c.answer).toLocaleString("en-US")} ${c.unit}`));
    card.append(answer);
    if (c.fun_fact) card.append(el("p", { class: "row" }, "Fun fact: " + c.fun_fact));
    const source = el("p", { class: "row" }, (c.source_name || "Source") + " · ");
    if (/^https?:\/\//.test(c.source_url || "")) {
      source.append(el("a", { href: c.source_url, target: "_blank", rel: "noopener noreferrer" }, "Read the article ↗"));
    }
    card.append(source);

    const status = el("p", { class: "status", role: "status" });
    const actions = el("div", { class: "actions" });
    for (const [action, label] of [["approve", "Approve"], ["save", "Archive"], ["reject", "Reject"]]) {
      const b = el("button", { type: "button", class: action }, label);
      b.addEventListener("click", () => act(c, action, card));
      actions.append(b);
    }
    card.append(status, actions);
    paint(c, card);
    return card;
  }

  function paint(c, card, message, ok = true) {
    const status = card.querySelector(".status");
    const actions = card.querySelector(".actions");
    card.classList.toggle("done", c.state !== "pending");
    card.classList.toggle("live", c.state === "live");
    status.className = "status " + (ok ? "ok" : "bad");
    status.textContent = message || STATE_TEXT[c.state] || "";
    // A decided question can still be pushed live (archive → approve), but
    // nothing else changes once it's live, played or rejected.
    const final = ["live", "played", "rejected"].includes(c.state);
    actions.hidden = final;
    actions.querySelector(".save").hidden = c.state === "archived";
  }

  async function act(c, action, card) {
    if (action === "reject" && !confirm("Reject and delete this question?")) return;
    const buttons = card.querySelectorAll("button");
    buttons.forEach((b) => (b.disabled = true));
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ ...auth, id: c.id, action }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        paint(c, card, body.message || body.error || `Something went wrong (${res.status}).`, false);
      } else {
        c.state = body.state || c.state;
        paint(c, card, "✓ " + body.message.replace(/\.$/, ""));
      }
    } catch {
      paint(c, card, "No connection. Try again.", false);
    } finally {
      buttons.forEach((b) => (b.disabled = false));
      updateSummary();
    }
  }

  async function load() {
    if (!auth.day || !auth.exp || !auth.sig) {
      showError("Open this page from the button in the daily curator email.");
      return;
    }
    const d = new Date(auth.day + "T12:00:00Z");
    $("title").textContent = "Questions for " + d.toLocaleDateString("en-GB", { day: "numeric", month: "long" });
    try {
      const res = await fetch(API + "?" + new URLSearchParams(auth));
      const body = await res.json().catch(() => ({}));
      if (!res.ok) return showError(body.error || `Couldn't load the questions (${res.status}).`);
      candidates = body.candidates || [];
      $("loading").hidden = true;
      if (!candidates.length) {
        $("list").append(el("p", { class: "empty" }, "No questions left for this day. Rejected ones are gone; older undecided ones are deleted after 7 days."));
      }
      for (const c of candidates) $("list").append(render(c));
      updateSummary();
    } catch {
      showError("Couldn't reach Hunchline. Check your connection and reload.");
    }
  }

  load();
</script>
</body>
</html>
